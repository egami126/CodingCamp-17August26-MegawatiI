<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <div class="app-container">
    <!-- Header Utama -->
    <header class="main-header">
      <h1>Expense & Budget Visualizer</h1>
    </header>

    <!-- Card Total Balance (Dihitung Dinamis via JS) -->
    <section class="card balance-card">
      <span class="balance-label">TOTAL BALANCE</span>
      <h2 id="total-balance">$0.00</h2>
    </section>

    <!-- Content Grid Layout (2 Kolom) -->
    <main class="main-grid">
      <!-- Kolom Kiri: Transactions & Form Input -->
      <div class="left-column">
        
        <!-- List Transaksi -->
        <section class="card">
          <h2>Transactions</h2>
          <p id="list-empty-state" class="empty-state">No transactions added yet.</p>
          <ul id="transaction-list" class="transaction-list"></ul>
        </section>

        <!-- Form Tambah Transaksi -->
        <section class="card">
          <h2>Add Transaction</h2>
          <form id="transaction-form" novalidate>
            <div class="form-group">
              <label for="item-name">Item Name</label>
              <input
                type="text"
                id="item-name"
                name="item-name"
                maxlength="100"
                placeholder="e.g. Kimpul"
                autocomplete="off"
                required
              />
            </div>

            <div class="form-group">
              <label for="amount">Amount</label>
              <input
                type="number"
                id="amount"
                name="amount"
                min="0.01"
                max="999999.99"
                step="0.01"
                placeholder="0.01"
                required
              />
            </div>

            <div class="form-group">
              <label for="category">Category</label>
              <select id="category" name="category" required>
                <option value="">-- Select a category --</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Fun">Fun</option>
              </select>
            </div>

            <button type="submit" class="btn-primary">Add Transaction</button>
          </form>
        </section>
      </div>

      <!-- Kolom Kanan: Diagram Spending by Category -->
      <div class="right-column">
        <section class="card chart-card">
          <h2>Spending by Category</h2>
          <p id="chart-empty-state" class="empty-state">No spending data available.</p>
          <div class="chart-wrapper">
            <canvas id="spending-chart" aria-label="Spending pie chart" role="img"></canvas>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Library Chart.js & Script Utama -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
