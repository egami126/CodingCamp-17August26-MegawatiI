<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-container">
    <!-- Header (Center Alignment) -->
    <header class="main-header">
      <h1>Expense & Budget Visualizer</h1>
      <button id="theme-toggle" class="btn-theme" aria-label="Toggle Theme">🌙 Dark Mode</button>
    </header>

    <!-- Card Total Balance -->
    <section class="card balance-card">
      <span class="balance-label">TOTAL BALANCE</span>
      <h2 id="total-balance">$0.00</h2>
    </section>

    <main class="main-layout">
      <!-- Left (Add Transaction) & Right (Transaction List) -->
      <div class="top-row">
        
        <!-- 1. Add Transaction Form -->
        <section class="card form-card">
          <h2>Add Transaction</h2>
          <form id="transaction-form" novalidate>
            <div class="form-group">
              <label for="item-name">Item Name</label>
              <input type="text" id="item-name" name="item-name" maxlength="100" placeholder="e.g. Cilok" autocomplete="off" required />
            </div>

            <div class="form-group">
              <label for="amount">Amount</label>
              <input type="number" id="amount" name="amount" min="0.01" max="999999.99" step="0.01" placeholder="0.00" required />
            </div>

            <div class="form-group">
              <label for="category">Category</label>
              <div class="category-select-wrapper">
                <select id="category" name="category" required></select>
                <button type="button" id="btn-add-custom-category" class="btn-secondary">+ New</button>
              </div>
            </div>

            <button type="submit" class="btn-primary">Add Transaction</button>
          </form>
        </section>

        <!-- 2. Transaction List -->
        <section class="card list-card">
          <div class="card-header-flex">
            <h2>Transactions</h2>
            <div class="filter-group">
              <label for="sort-category-filter">Filter:</label>
              <select id="sort-category-filter">
                <option value="ALL">All Categories</option>
              </select>
            </div>
          </div>
          <p id="list-empty-state" class="empty-state">No transactions added yet.</p>
          <ul id="transaction-list" class="transaction-list"></ul>
        </section>

      </div>

      <!-- Spending by Category Chart -->
      <div class="bottom-row">
        <section class="card chart-card">
          <h2>Spending by Category</h2>
          <p id="chart-empty-state" class="empty-state">No spending data available.</p>
          <div class="chart-wrapper">
            <canvas id="spending-chart" aria-label="Spending pie chart" role="img"></canvas>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
